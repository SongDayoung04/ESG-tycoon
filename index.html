<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESG 증류소 타이쿤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=DotGothic16&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: arcade cabinet — pixel distillery scene + HUD on the left, the turn's panel on the right; stacks on phones. Single dark "night shift" look. */
:root{
  color-scheme: dark;
  --night:#161a33; --night-2:#1f2547; --panel:#252c55; --line:#3b4478;
  --cream:#f4ead2; --mute:#aeb3d6; --dim:#7e86b8;
  --amber:#f0a83a; --copper:#c8693a; --red:#ff6b6b; --gold:#ffd166;
  --e:#5fd38a; --s:#ff8f6b; --g:#a98bff;
  --display:'Do Hyeon','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR',system-ui,sans-serif;
  --pix:'DotGothic16','Noto Sans KR',monospace;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.screen{position:relative;border:4px solid var(--line);background:#0e1126;box-shadow:0 0 0 4px #0b0d1f, 0 10px 0 4px #0b0d1f}
.screen canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hud .cell{background:var(--night-2);border:2px solid var(--line);padding:8px 10px;min-width:0}
.hud .k{font-size:12px;color:var(--mute);letter-spacing:.04em}
.hud .v{font-family:var(--pix);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{background:var(--night-2);border:2px solid var(--line);padding:8px 10px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px}
.meter .top b{font-family:var(--display);font-weight:400;font-size:18px}
.bar{height:12px;background:#11152e;border:2px solid #0b0d1f;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0}
.bar i.pend{opacity:.35}
.meter small{display:block;color:var(--dim);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}

.panel{background:var(--panel);border:4px solid var(--line);box-shadow:0 8px 0 #0b0d1f;padding:22px;min-width:0;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:44px;color:var(--amber);letter-spacing:.01em}
h2{font-size:30px}
h3{font-size:21px}
p{margin:0}
.eyebrow{font-family:var(--pix);font-size:13px;color:var(--amber);letter-spacing:.12em}
.lead{color:var(--mute)}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-size:22px;padding:12px 20px;background:var(--amber);color:#2a1a05;box-shadow:inset -4px -4px 0 #b9761c, inset 4px 4px 0 #ffd38a;letter-spacing:.02em}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--night-2);color:var(--cream);box-shadow:inset -4px -4px 0 #11152e, inset 4px 4px 0 #3b4478}
.btn:focus-visible,.step:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 160px;min-width:0}
.field label{font-size:13px;color:var(--mute)}
.field input[type=text]{background:#11152e;border:2px solid var(--line);padding:10px 12px;font-size:17px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.check input{width:18px;height:18px;accent-color:var(--amber)}
.link{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;cursor:pointer;font-size:14px}

.alloc{display:flex;flex-direction:column;gap:12px}
.acard{border:2px solid var(--line);background:var(--night-2);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.acard .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.acard .name{font-family:var(--display);font-size:21px}
.acard .amt{font-family:var(--pix);font-size:24px;font-variant-numeric:tabular-nums}
.acard .desc{font-size:13px;color:var(--mute)}
.ctrl{display:flex;gap:8px;align-items:center}
.step{width:44px;height:40px;border:0;background:#11152e;box-shadow:inset -3px -3px 0 #0b0d1f, inset 3px 3px 0 #3b4478;font-family:var(--pix);font-size:20px;cursor:pointer;flex:none}
.ctrl input[type=range]{flex:1;min-width:0;accent-color:var(--amber);height:28px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border:2px solid currentColor;line-height:1.4;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.tag.research{color:var(--gold)}
.tag.scenario{color:var(--dim)}
.sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mute);border-top:2px dashed var(--line);padding-top:10px}
.sum b{color:var(--cream);font-family:var(--pix);font-weight:400;font-size:18px}

.card{border:4px solid var(--line);background:#141936;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.card canvas{width:64px;height:64px;image-rendering:pixelated;background:#0e1126;border:2px solid var(--line)}
.card.neg{border-color:#7a3344}
.card.pos{border-color:#7a6a2a}
.card .t{font-family:var(--display);font-size:24px;line-height:1.2}
.card .d{font-size:14px;color:var(--mute)}
.ledger{display:flex;flex-direction:column;gap:0;border:2px solid var(--line)}
.ledger .li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-top:2px solid var(--line);align-items:center}
.ledger .li:first-child{border-top:0}
.ledger .li .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;font-size:14px}
.ledger .li .n{font-family:var(--pix);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger .li.total{background:var(--night-2)}
.ledger .li.total .l{font-family:var(--display);font-size:19px}
.ledger .li.total .n{font-size:24px}
.plus{color:var(--e)} .minus{color:var(--red)}
.note{font-size:13px;color:var(--mute);background:#141936;border-left:4px solid var(--amber);padding:8px 12px}

.board{display:flex;flex-direction:column;border:2px solid var(--line)}
.board .br{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;padding:7px 12px;border-top:2px solid var(--line);align-items:center;font-size:15px}
.board .br:first-child{border-top:0}
.board .br .rk{font-family:var(--pix);color:var(--amber)}
.board .br .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .br .pf{font-family:var(--pix);font-variant-numeric:tabular-nums}
.board .br.me{background:#3a3418}
.board .empty{padding:14px;color:var(--mute);font-size:14px}
.boardnote{font-size:12px;color:var(--dim)}

.result-big{font-family:var(--pix);font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vs .c{border:2px solid var(--line);background:var(--night-2);padding:10px 12px}
.vs .c .k{font-size:13px;color:var(--mute)}
.vs .c .v{font-family:var(--pix);font-size:22px;font-variant-numeric:tabular-nums}
.chartwrap canvas{width:100%;aspect-ratio:2/1;image-rendering:pixelated;background:#0e1126;border:2px solid var(--line);display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.twin{border:2px solid var(--gold);background:#2a2a3e;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.twin b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--gold)}

.basis{border-collapse:collapse;width:100%;font-size:13px}
.basis th,.basis td{border:2px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.basis th{background:var(--night-2);font-weight:700}
.tablewrap{overflow-x:auto}
.timeline{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.timeline i{height:10px;background:#11152e;border:2px solid #0b0d1f}
.timeline i.done{background:var(--amber)}
.timeline i.now{background:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.timeline i.now{animation:none}.flash{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app">
  <section class="stage" aria-label="회사 현황">
    <div class="screen">
      <canvas id="scene" width="192" height="108" aria-label="밤의 증류소. 나무는 E, 사람은 S, 본사 건물 불빛은 G 투자 효과를 나타냅니다."></canvas>
      <div class="flash" id="flash"></div>
    </div>
    <div class="timeline" id="timeline" aria-hidden="true"></div>
    <div class="hud">
      <div class="cell"><div class="k">시점</div><div class="v" id="hudTime">2027 상반기</div></div>
      <div class="cell"><div class="k">누적 순이익</div><div class="v" id="hudCum">0억</div></div>
      <div class="cell"><div class="k">남은 ESG 예산</div><div class="v" id="hudBudget">100억</div></div>
    </div>
    <div class="meters" id="meters"></div>
  </section>

  <main class="panel" id="panel" aria-live="polite"></main>
</div>

<script>
(() => {
// ───────── 게임 수치 (몬테카를로 시뮬레이션으로 맞춤) ─────────
const BASE = 300;          // 반기 기본 순이익(억) = 자산 1조 × 연 ROA 6% ÷ 2
const LAG = 2;             // 효과 발동까지 반기 수(1년)
const K = 30;              // 수확 체감 상수(억)
const DEF = 0.4;           // 최대 방어율 40%
const POS_BASE = 0.55;     // 투자가 없어도 받는 긍정 이벤트 몫
const FRIC = 0.4;          // S·G 전환 비용(투자액의 40%, 1년에 걸쳐)
const BUDGET = 100;
const AREAS = ['E','S','G'];
const AREA = {
  E:{name:'환경 E', color:'#5fd38a', desc:'탄소세·가뭄·폐수 사고를 막고, 친환경 이슈 때 수혜'},
  S:{name:'사회 S', color:'#ff8f6b', desc:'광고 논란·불매운동·안전사고·공급망 리스크를 막고, 책임음주·상생 이슈 때 수혜'},
  G:{name:'지배구조 G', color:'#a98bff', desc:'회계 부정·오너 리스크·소송을 막고, ESG 펀드 편입·투자 유치 때 수혜'}
};
const EVENTS = [
  {a:'E',v:-120,t:'탄소세 도입',d:'정부가 증류·발효 공정의 탄소 배출에 세금을 매기기 시작했다.',i:'factory'},
  {a:'E',v:-100,t:'가뭄으로 원료값 급등',d:'보리와 공업용수 가격이 치솟았다. 물을 아껴 쓰는 공장일수록 덜 흔들린다.',i:'drop'},
  {a:'E',v:-180,t:'폐수 무단 방류 적발',d:'증류 폐수 처리 기준 위반으로 과징금과 일부 라인 가동 중단.',i:'factory'},
  {a:'S',v:-110,t:'음주 조장 광고 논란',d:'SNS 광고가 과음을 부추긴다는 비판이 쏟아졌다.',i:'mega'},
  {a:'S',v:-200,t:'미성년자 판매 논란, 불매운동',d:'편의점 판매 관리 소홀이 보도되며 불매 해시태그가 퍼졌다.',i:'warn'},
  {a:'S',v:-150,t:'병입 공장 안전사고',d:'안전 설비 미비로 사고가 나 라인이 멈추고 조사가 시작됐다.',i:'warn'},
  {a:'S',v:-160,t:'공급망 인권 침해 의혹',d:'원료 농장의 노동 착취 의혹이 해외 언론에 보도됐다.',i:'mega'},
  {a:'G',v:-220,t:'회계 부정 의혹',d:'매출 부풀리기 의혹으로 주가가 급락하고 감사가 시작됐다.',i:'down'},
  {a:'G',v:-140,t:'오너 일가 갑질 논란',d:'경영진 일가의 갑질 영상이 퍼지며 브랜드 이미지가 흔들렸다.',i:'down'},
  {a:'G',v:-130,t:'소액주주 집단소송',d:'불투명한 배당 결정에 반발한 주주들이 소송을 냈다.',i:'down'},
  {a:'E',v:70,t:'경량 친환경 병 대히트',d:'가벼운 재생 유리병이 화제가 되며 판매가 늘었다.',i:'leaf'},
  {a:'E',v:60,t:'녹색 설비 보조금 선정',d:'정부의 친환경 설비 지원 사업에 선정됐다.',i:'leaf'},
  {a:'E',v:50,t:'남은 탄소배출권 판매',d:'줄인 배출량만큼 남은 배출권을 팔았다.',i:'coin'},
  {a:'S',v:80,t:'책임음주 캠페인 바이럴',d:'“천천히, 즐겁게” 캠페인 영상이 100만 뷰를 넘었다.',i:'heart'},
  {a:'S',v:50,t:'지역 농가 상생 기업 선정',d:'계약 재배 농가와의 상생 모델이 상을 받았다.',i:'heart'},
  {a:'S',v:90,t:'무알코올 라인 대히트',d:'건강을 챙기는 소비자 사이에서 무알코올 제품이 품절됐다.',i:'heart'},
  {a:'S',v:40,t:'일하기 좋은 기업 선정',d:'우수 인재가 몰리며 생산성이 올랐다.',i:'heart'},
  {a:'G',v:100,t:'글로벌 ESG 펀드 편입',d:'대형 ESG 펀드가 지분을 사들이며 자금 조달 비용이 낮아졌다.',i:'coin'},
  {a:'G',v:90,t:'해외 기관투자자 유치',d:'투명한 이사회 구조가 평가받아 해외 투자를 유치했다.',i:'up'},
  {a:'G',v:40,t:'이사회 독립성 A등급',d:'지배구조 평가에서 A등급을 받아 신용도가 올랐다.',i:'up'}
];
// 실제 27개사 ESG 점수 (KnowESG 2024) · ROA 2023 · K-means 군집
const COMPANIES = [
 ['Luzhou Laojiao',2.3,2.1,1.5,20.9],['Ambev',3.0,2.0,1.4,10.9],['Anhui Gujing',2.7,1.7,2.1,13.0],
 ['Asahi',3.7,4.1,3.6,3.1],['Beijing Shunxin',1.9,1.9,1.6,-1.9],['Boston Beer',3.0,2.6,3.0,5.3],
 ['Brown-Forman',2.1,2.1,2.8,10.1],['Carlsberg',3.3,4.6,3.5,-36.5],['China Resources Beer',2.8,3.1,1.5,7.2],
 ['Constellation Brands',3.1,1.3,2.9,-0.3],['Campari',3.7,3.3,2.1,5.0],['Diageo',4.1,5.6,4.0,9.9],
 ['Heineken',3.9,3.3,1.8,2.1],['Jiangsu Yanghe',2.3,1.3,1.9,14.4],['Jiugui Liquor',1.6,1.7,0.9,9.7],
 ['Kirin',3.7,3.7,3.8,3.9],['Kweichow Moutai',3.7,2.1,1.5,27.4],['Molson Coors',3.2,2.4,3.6,3.6],
 ['Pernod Ricard',4.1,2.9,2.1,6.0],['Rémy Cointreau',3.3,2.9,3.0,9.2],['Shanxi Fen Wine',1.8,0.0,1.3,23.7],
 ['Suntory Beverage & Food',3.4,3.3,3.1,4.3],['Thai Beverage',3.9,3.3,2.0,4.5],['Treasury Wine Estates',3.1,2.7,3.6,3.6],
 ['Tsingtao',2.8,1.7,2.3,8.7],['United Breweries',2.4,3.4,1.5,4.8],['United Spirits',3.5,4.0,2.9,11.6]
];
const RANGE = {E:[1.6,4.1],S:[0.0,5.6],G:[0.9,4.0]};

// ───────── 상태 ─────────
const fresh = () => ({
  phase:'title', name:'', num:'', practice:false,
  alloc:{E:30,S:35,G:35}, topup:{E:0,S:0,G:0},
  inv:[], half:0, revealed:false, deck:[], rows:[],
  cum:0, cumZero:0, cumBal:0, series:[], seriesZero:[], seriesBal:[], saved:false, savedNote:'', rank:null
});
let S = fresh();
let showBasis = false;

const $ = s => document.querySelector(s);
const panel = $('#panel');
const fmt = n => { const r = Math.round(n); return (r<0?'−':'') + Math.abs(r).toLocaleString('ko-KR') + '억'; };
const sfmt = n => { const r = Math.round(n); return (r>0?'+':r<0?'−':'±') + Math.abs(r).toLocaleString('ko-KR') + '억'; };
const halfLabel = h => `${2027+Math.floor(h/2)} ${h%2===0?'상반기':'하반기'}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const invested = () => S.inv.reduce((t,x)=>t+x.amt,0);
const budgetLeft = () => BUDGET - invested();
function effAt(list, a, h){ return list.filter(x=>x.a===a && h >= x.h+LAG).reduce((t,x)=>t+x.amt,0); }
function pendAt(list, a, h){ return list.filter(x=>x.a===a && h < x.h+LAG).reduce((t,x)=>t+x.amt,0); }
const score = amt => 1 - Math.exp(-amt/K);

function settleHalf(list, h, ev){
  const cost = list.filter(x=>x.h===h).reduce((t,x)=>t+x.amt,0);
  const fric = list.filter(x=>(x.a==='S'||x.a==='G') && (x.h===h || x.h===h-1)).reduce((t,x)=>t+x.amt*FRIC/2,0);
  const sc = score(effAt(list, ev.a, h));
  const impact = ev.v<0 ? ev.v*(1-DEF*sc) : ev.v*(POS_BASE+(1-POS_BASE)*sc);
  const raw = ev.v<0 ? ev.v : ev.v*POS_BASE;
  return {cost, fric, sc, impact, raw, net: BASE - cost - fric + impact};
}
const BAL_PLAN = [{h:0,a:'E',amt:33},{h:0,a:'S',amt:33},{h:0,a:'G',amt:34}];

// ───────── 픽셀 스프라이트 ─────────
const SPR = {

 factory:['.ss.......','sssss.....','.sss......','..CC......','..CC..CC..','.CCCCCCCC.','.CyCCyCCy.','.CCCCCCCC.','.CCCCCCCC.','..........'],
 drop:['....b.....','....b.....','...bbb....','...bbb....','..bbbbb...','..bbwbb...','..bwbbb...','...bbb....','..........','..........'],
 mega:['......r...','....rrr...','..rrrrr.w.','yyrrrrr...','yyrrrrr.w.','..rrrrr...','....rrr.w.','......r...','..........','..........'],
 warn:['....y.....','...yyy....','...yKy....','..yyKyy...','..yyKyy...','.yyyyyyy..','.yyyKyyy..','yyyyyyyyy.','..........','..........'],
 heart:['..........','.rr...rr..','rrrr.rwrr.','rrrrrrwrr.','rrrrrrrrr.','.rrrrrrr..','..rrrrr...','...rrr....','....r.....','..........'],
 coin:['...yyyy...','..yYYYYy..','.yYyyyyYy.','.yYyYYyYy.','.yYyYYyYy.','.yYyyyyYy.','..yYYYYy..','...yyyy...','..........','..........'],

};
const SPAL = {G:'#5fd38a',g:'#2f8a55',s:'#9aa0c4',C:'#8a4d3a',y:'#ffd166',Y:'#f0a83a',b:'#5bb4ff',w:'#f4ead2',r:'#ff6b6b',K:'#1a1a2e'};
function iconCanvas(key){
  const c = document.createElement('canvas'); c.width=10; c.height=10;
  const x = c.getContext('2d'); const m = SPR[key]||SPR.coin;
  m.forEach((row,y)=>[...row].forEach((ch,i)=>{ if(ch!=='.'){ x.fillStyle=SPAL[ch]; x.fillRect(i,y,1,1);} }));
  c.setAttribute('aria-hidden','true'); return c;

// ───────── 장면 (192×108 픽셀) ─────────
const cv = $('#scene'), cx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stars = Array.from({length:40},()=>({x:Math.random()*192|0,y:Math.random()*48|0,p:Math.random()*6}));
let puffs = [], tick = 0, sparkle = 0, storm = 0;
function px(x,y,w,h,c){ cx.fillStyle=c; cx.fillRect(x|0,y|0,w|0,h|0); }
function sceneState(){
  const h = S.phase==='alloc' ? 0 : Math.min(S.half, 9);
  const list = curList();
  const st = {};
  AREAS.forEach(a=>{ st[a] = {eff:score(effAt(list,a,h)), pend:score(effAt(list,a,h)+pendAt(list,a,h))}; });
  return st;
}
function drawTree(x,y,grown){
  if(!grown){ px(x+2,y-3,1,3,'#6a4a2a'); px(x+1,y-5,3,2,'#3d7a52'); return; }
  px(x+2,y-5,2,5,'#6a4a2a'); px(x,y-12,6,4,'#2f8a55'); px(x-1,y-9,8,4,'#3fa868'); px(x+1,y-14,4,2,'#5fd38a');
}
function drawPerson(x,y,c,step){
  px(x+1,y-8,3,3,'#f2c9a0'); px(x,y-5,5,4,c); px(x+(step?0:1),y-1,1,1,'#22264a'); px(x+(step?4:3),y-1,1,1,'#22264a');
}
function draw(){
  tick++;
  // sky
  px(0,0,192,30,'#141838'); px(0,30,192,20,'#1b2050'); px(0,50,192,20,'#252b62');
  stars.forEach(s=>{ const on = reduce || ((tick/20+s.p)%6)>1; if(on) px(s.x,s.y,1,1, s.p>4?'#ffe9a8':'#c9cdf0'); });
  px(160,8,9,9,'#f4ead2'); px(163,9,6,7,'#141838'); // moon
  // hills & ground
  px(0,70,192,6,'#1d2a3a'); px(0,76,192,32,'#1f3a2c'); px(0,76,192,2,'#2c5a3e');
  for(let i=0;i<192;i+=12) px(i,90+((i/12)%2),6,1,'#2c5a3e');
  const st = sceneState();
  // HQ tower (G)
  px(140,34,26,44,'#2a2f55'); px(140,34,26,2,'#3b4478');
  const lit = Math.round(st.G.eff*12), pend = Math.round(st.G.pend*12);
  for(let r=0;r<6;r++) for(let c=0;c<2;c++){ const idx=r*2+c; const col = idx<lit?'#ffd166': idx<pend?'#6b5d3a':'#151935'; px(144+c*10,39+r*6,6,3,col); }
  px(151,28,1,6,'#9aa0c4'); px(152,28,5,3, st.G.eff>0.3?'#a98bff':'#4a4570');
  // distillery building
  px(46,48,62,30,'#7a3d2c'); for(let r=0;r<6;r++) for(let c=0;c<12;c++) if((r+c)%3===0) px(47+c*5+(r%2)*2,50+r*5,3,1,'#6a3324');
  px(44,44,66,5,'#4a2a22'); px(70,62,12,16,'#2b1a14'); px(54,55,8,6,'#ffcf7a'); px(92,55,8,6,'#ffcf7a');
  // chimney + smoke
  px(98,26,8,20,'#5a2e22'); px(97,24,10,3,'#3a1e18');
  if(!reduce && tick%14===0) puffs.push({x:101,y:22,r:2,life:0});
  puffs.forEach(p=>{ p.y-=0.35; p.x+=0.18; p.life++; p.r = 2+p.life/40; });
  puffs = puffs.filter(p=>p.life<110);
  const smoke = st.E.eff>0.5 ? '#c9cdf0' : '#8f93ad';
  puffs.forEach(p=>{ cx.globalAlpha = Math.max(0,1-p.life/110)*0.7; px(p.x,p.y,p.r,p.r,smoke); });
  cx.globalAlpha = 1;
  // copper pot still
  px(18,58,22,20,'#c8693a'); px(20,54,18,4,'#d9874f'); px(24,48,10,6,'#d9874f'); px(27,42,4,6,'#b8643a');
  px(31,42,16,2,'#b8643a'); px(22,62,4,10,'#e9a36b');
  // barrels
  [[112,68],[121,68],[116,62]].forEach(([x,y])=>{ px(x,y,8,9,'#7a4a24'); px(x,y+2,8,1,'#3a2410'); px(x,y+6,8,1,'#3a2410'); });
  // sign
  px(58,40,38,8,'#22264a'); px(58,40,38,1,'#f0a83a');
  cx.fillStyle='#f0a83a'; cx.font='6px monospace'; cx.fillText('SAMSONG',62,46);
  // trees (E)
  const trees = Math.round(st.E.pend*6), grownT = Math.round(st.E.eff*6);
  for(let i=0;i<trees;i++) drawTree(4+i*7+(i>2?0:0), 92 - (i%2)*4, i<grownT);
  // people (S)
  const ppl = Math.round(st.S.pend*6), activeP = Math.round(st.S.eff*6);
  const cols = ['#ff8f6b','#5bb4ff','#ffd166','#f4ead2','#5fd38a','#a98bff'];
  for(let i=0;i<ppl;i++){
    const base = 60+i*14; const wander = reduce?0:Math.sin((tick+i*40)/40)*3;
    if(i<activeP) drawPerson(base+wander, 100, cols[i], (tick>>4)%2);
    else { cx.globalAlpha=.45; drawPerson(base, 100, '#7e86b8', 0); cx.globalAlpha=1; }
  }
  // effects
  if(storm>0){ cx.globalAlpha = Math.min(.35, storm/60); px(0,0,192,108,'#ff2b4a'); cx.globalAlpha=1;
    if(!reduce) for(let i=0;i<30;i++){ const x=(Math.random()*192)|0, y=(Math.random()*108)|0; px(x,y,1,3,'#9fb6ff'); }
    storm--; }
  if(sparkle>0){ if(!reduce) for(let i=0;i<14;i++){ px(Math.random()*192,Math.random()*70,1,1,'#ffd166'); px(Math.random()*192,Math.random()*70,2,2,'#fff2c2'); }
    else { cx.globalAlpha=.15; px(0,0,192,108,'#ffd166'); cx.globalAlpha=1; } sparkle--; }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ───────── HUD ─────────
function curList(){
  if(S.phase==='alloc') return AREAS.filter(a=>S.alloc[a]>0).map(a=>({h:0,a,amt:S.alloc[a]}));
  if(S.phase==='title'||S.phase==='brief') return [];
  return S.inv;
}
function renderHud(){
  const h = S.phase==='result' ? 9 : S.half;
  $('#hudTime').textContent = S.phase==='title'||S.phase==='brief'||S.phase==='alloc' ? '2027 상반기' : S.phase==='result' ? '2031 결산' : halfLabel(h);
  $('#hudCum').textContent = fmt(S.cum);
  $('#hudBudget').textContent = fmt(S.phase==='alloc' ? BUDGET - (S.alloc.E+S.alloc.S+S.alloc.G) : budgetLeft());
  const tl = $('#timeline'); tl.innerHTML='';
  for(let i=0;i<10;i++){ const b=document.createElement('i');
    if(S.phase==='result' || i < S.rows.length) b.className='done';
    else if((S.phase==='play'||S.phase==='topup') && i===S.half) b.className='now';
    tl.appendChild(b); }
  const m = $('#meters'); m.innerHTML='';
  const hh = Math.min(h,9);
  AREAS.forEach(a=>{
    const list = curList();
    const eff = effAt(list,a,hh), pend = pendAt(list,a,hh);
    const se = score(eff)*DEF*100, sp = score(eff+pend)*DEF*100;
    const d = document.createElement('div'); d.className='meter';
    d.innerHTML = `<div class="top"><b style="color:${AREA[a].color}">${a}</b><span>방어력 ${Math.round(se)}%</span></div>
      <div class="bar" role="img" aria-label="${AREA[a].name} 방어력 ${Math.round(se)}%, 대기 중 포함 ${Math.round(sp)}%"><i class="pend" style="width:${sp/DEF}%;background:${AREA[a].color}"></i><i style="width:${se/DEF}%;background:${AREA[a].color}"></i></div>
      <small>투자 ${eff+pend}억${pend?` · ${pend}억 효과 대기`:''}</small>`;
    m.appendChild(d);
  });
}

// ───────── 랭킹 저장소 ─────────
let db = null, boardRows = [], boardMode = 'loading';
const LS = 'esg-tycoon-scores';
function localRows(){ try{ return JSON.parse(localStorage.getItem(LS)||'[]'); }catch(e){ return []; } }
function localSave(r){ try{ const a=localRows(); a.push(r); localStorage.setItem(LS, JSON.stringify(a)); }catch(e){} }
function setLocalBoard(){ boardRows = localRows().sort((a,b)=>b.profit-a.profit).slice(0,10); boardMode='local'; refreshBoards(); }
setLocalBoard(); boardMode='loading';
(async ()=>{
  try{ db = window.claude ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(!db){ setLocalBoard(); return; }
  db.collection('scores').orderBy('profit','desc').limit(10).onSnapshot(snap=>{
    boardRows = snap.docs.map(d=>({id:d.id, ...d.data()})); boardMode='shared'; refreshBoards();
  }, ()=>{ setLocalBoard(); });
})();
function boardHTML(){
  if(boardMode==='loading') return `<div class="board"><div class="empty">랭킹을 불러오는 중…</div></div>`;
  if(!boardRows.length) return `<div class="board"><div class="empty">아직 기록이 없어요. 첫 CEO가 되어 보세요.</div></div>`;
  return `<div class="board">${boardRows.map((r,i)=>`<div class="br${S.savedId&&r.id===S.savedId?' me':''}"><span class="rk">${i+1}</span><span class="nm">${esc(r.name)}${r.num?` <span style="color:var(--dim)">#${esc(r.num)}</span>`:''}</span><span class="pf">${fmt(r.profit)}</span></div>`).join('')}</div>`;
}
function boardNote(){ return boardMode==='local' ? '<p class="boardnote">공유 저장소에 연결되지 않아 이 기기에만 저장돼요.</p>' : ''; }
function refreshBoards(){ document.querySelectorAll('[data-board]').forEach(el=>{ el.innerHTML = boardHTML() + boardNote(); }); }
async function saveScore(){
  if(S.practice || S.saved) return;
  const rec = {name:S.name, num:S.num, profit:Math.round(S.cum), diff:Math.round(S.cum-S.cumZero),
    E:sumArea('E'), S:sumArea('S'), G:sumArea('G'), at:new Date().toISOString()};
  S.saved = true;
  if(db){
    try{
      if(S.num){
        const dup = await db.collection('scores').where('num','==',S.num).limit(1).get();
        if(!dup.empty){ S.savedNote = `참가번호 #${S.num}은 이미 랭킹에 있어서 이번 판은 연습으로 처리했어요.`; render(); return; }
      }
      const ref = db.collection('scores').doc(); await ref.set(rec); S.savedId = ref.id;
      const above = await db.collection('scores').where('profit','>',rec.profit).limit(1000).get();
      S.rank = above.size + 1; S.savedNote = `랭킹에 등록했어요. 현재 ${S.rank}위!`;
    }catch(e){ localSave(rec); setLocalBoard(); S.savedNote='공유 랭킹 저장에 실패해 이 기기에 저장했어요.'; }
  } else { localSave(rec); setLocalBoard(); const all = localRows(); S.rank = all.filter(r=>r.profit>rec.profit).length+1; S.savedNote = `이 기기 랭킹 ${S.rank}위로 저장했어요.`; }
  render();
}
const sumArea = a => S.inv.filter(x=>x.a===a).reduce((t,x)=>t+x.amt,0);

function stepper(obj, cap, onChange){
  const wrap = document.createElement('div'); wrap.className='alloc';
  AREAS.forEach(a=>{
    const c = document.createElement('div'); c.className='acard';
    c.innerHTML = `<div class="head"><span class="name" style="color:${AREA[a].color}">${AREA[a].name}</span><span class="amt" id="amt${a}">${obj[a]}억</span></div>
      <p class="desc">${AREA[a].desc}${a!=='E'?' <span class="tag research">첫 1년 전환 비용 40%</span>':''}</p>
      <div class="ctrl"><button class="step" data-d="-5" aria-label="${AREA[a].name} 5억 줄이기">−</button>
      <input type="range" id="rng${a}" min="0" max="${cap}" step="5" value="${obj[a]}" aria-label="${AREA[a].name} 투자액">
      <button class="step" data-d="5" aria-label="${AREA[a].name} 5억 늘리기">+</button></div>`;
    const set = v => {
      const others = AREAS.filter(b=>b!==a).reduce((t,b)=>t+obj[b],0);
      obj[a] = Math.max(0, Math.min(v, cap - others));
      c.querySelector('input').value = obj[a]; c.querySelector('.amt').textContent = obj[a]+'억'; onChange();
    };
    c.querySelector('input').addEventListener('input', e=>set(+e.target.value));
    c.querySelectorAll('.step').forEach(b=>b.onclick=()=>set(obj[a]+(+b.dataset.d)));
    wrap.appendChild(c);
  });
  return wrap;
}

function alloc(){
  panel.innerHTML = `<p class="eyebrow">2027 상반기 · 첫 투자</p><h2>ESG 예산 100억, 어디에 쓸까요?</h2><div id="st"></div><div class="sum" id="sum"></div>

  const upd = () => {
    const t = S.alloc.E+S.alloc.S+S.alloc.G, fr = (S.alloc.S+S.alloc.G)*FRIC;
    $('#sum').innerHTML = `<span>투자 합계 <b>${t}억</b></span><span>남는 예산 <b>${BUDGET-t}억</b></span><span>첫해 추가 전환 비용 <b>${Math.round(fr)}억</b></span>`;
    renderHud();
  };
  $('#st').appendChild(stepper(S.alloc, BUDGET, upd)); upd();
  $('#go').onclick = startGame;
  $('#zero').onclick = () => { S.alloc={E:0,S:0,G:0}; startGame(); };
}

function startGame(){
  const deck = [...EVENTS.keys()]; for(let i=deck.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [deck[i],deck[j]]=[deck[j],deck[i]]; }
  S.deck = deck.slice(0,10);
  S.inv = AREAS.filter(a=>S.alloc[a]>0).map(a=>({h:0,a,amt:S.alloc[a]}));
  S.half=0; S.revealed=false; S.rows=[]; S.cum=0; S.cumZero=0; S.cumBal=0; S.series=[]; S.seriesZero=[]; S.seriesBal=[];
  S.phase='play'; render();
}

function play(){
  const h = S.half, ev = EVENTS[S.deck[h]];
  if(!S.revealed){
    const thisCost = S.inv.filter(x=>x.h===h).reduce((t,x)=>t+x.amt,0);
    panel.innerHTML = `<p class="eyebrow">${halfLabel(h)} · ${h+1} / 10</p><h2>이번 반기에는 무슨 일이?</h2>
      <p class="lead">${h<2?'아직 투자 효과가 나타나기 전입니다. 버텨야 할 시기예요.':'지금까지 쌓은 방어력으로 맞섭니다.'}${thisCost?` 이번 반기에 ESG 투자 ${thisCost}억이 집행됩니다.`:''}</p>
      <div class="row"><button class="btn" id="go">사건 카드 뒤집기</button></div>`;
    $('#go').onclick = () => { S.revealed=true; resolveHalf(); render(); };
    return;
  }
  const r = S.rows[h];
  const card = document.createElement('div'); card.className = 'card ' + (ev.v<0?'neg':'pos');
  card.appendChild(iconCanvas(ev.i));
  const body = document.createElement('div');
  body.innerHTML = `<div class="row" style="gap:6px"><span class="tag" style="color:${AREA[ev.a].color}">${AREA[ev.a].name}</span><span class="tag ${ev.v<0?'':''}" style="color:${ev.v<0?'var(--red)':'var(--gold)'}">${ev.v<0?'악재':'호재'}</span><span class="tag scenario">가상 시나리오</span></div>
    <div class="t">${ev.t}</div><p class="d">${ev.d}</p>`;
  card.appendChild(body);
  const pct = Math.round(r.sc*DEF*100);
  const evLine = ev.v<0
    ? (r.sc>0 ? `원래 ${sfmt(ev.v)} → ${ev.a} 투자 덕분에 피해 ${pct}% 감소` : `${ev.a} 방어력이 없어 피해를 그대로 받음`)
    : (r.sc>0 ? `기본 ${sfmt(r.raw)} + ${ev.a} 투자로 ${sfmt(r.impact-r.raw)} 추가` : `${ev.a} 투자가 없어 기본 효과만 받음`);
  panel.innerHTML = `<p class="eyebrow">${halfLabel(h)} · ${h+1} / 10</p>`;
  panel.appendChild(card);
  const led = document.createElement('div'); led.className='ledger';
  led.innerHTML = `
    <div class="li"><span class="l">평소 순이익</span><span class="n plus">+300억</span></div>
    ${r.cost?`<div class="li"><span class="l">ESG 투자 집행</span><span class="n minus">${sfmt(-r.cost)}</span></div>`:''}
    ${r.fric?`<div class="li"><span class="l">S·G 전환 비용 <span class="tag research">우리 연구</span></span><span class="n minus">${sfmt(-r.fric)}</span></div>`:''}
    <div class="li"><span class="l">사건: ${evLine}</span><span class="n ${r.impact<0?'minus':'plus'}">${sfmt(r.impact)}</span></div>
    <div class="li total"><span class="l">이번 반기 ${r.net<0?'적자':'순이익'}</span><span class="n ${r.net<0?'minus':'plus'}">${sfmt(r.net)}</span></div>`;
  panel.appendChild(led);
  const diff = S.cum - S.cumZero;
  const n = document.createElement('p'); n.className='note';
  n.innerHTML = `같은 사건을 겪은 <b>ESG 0원 회사</b>보다 지금 <b>${diff>=0?sfmt(diff)+' 앞서':sfmt(diff)+' 뒤처져'}</b> 있어요.`;
  if(invested()===0) n.innerHTML = `지금 회사는 ESG에 투자하지 않은 상태예요. 사건 피해를 그대로 받습니다.`;
  panel.appendChild(n);
  const row = document.createElement('div'); row.className='row';
  const last = h===9;
  const yearEnd = h%2===1 && !last;
  row.innerHTML = `<button class="btn" id="go">${last?'5년 결산 보기':yearEnd?`${2027+Math.floor(h/2)}년 마감`:'다음 반기로'}</button>`;
  panel.appendChild(row);
  $('#go').onclick = () => {
    if(last){ S.phase='result'; render(); saveScore(); return; }
    if(yearEnd && budgetLeft()>0){ S.topup={E:0,S:0,G:0}; S.phase='topup'; render(); return; }
    S.half++; S.revealed=false; render();
  };
}

function resolveHalf(){
  const h = S.half, ev = EVENTS[S.deck[h]];
  const r = settleHalf(S.inv, h, ev);
  const z = settleHalf([], h, ev);
  const b = settleHalf(BAL_PLAN, h, ev);
  S.rows[h] = r; S.cum += r.net; S.cumZero += z.net; S.cumBal += b.net;
  S.series.push(S.cum); S.seriesZero.push(S.cumZero); S.seriesBal.push(S.cumBal);
  if(ev.v<0) storm = 70; else sparkle = 60;
}

function topup(){
  const h = S.half, nextH = h+1, effH = nextH + LAG;
  const left = budgetLeft();
  panel.innerHTML = `<p class="eyebrow">${2027+Math.floor(h/2)}년 연말 이사회</p><h2>ESG 투자를 늘릴까요?</h2>
    <p class="lead">남은 예산 ${left}억. 지금 투자하면 ${halfLabel(nextH)}에 집행되고, 효과는 ${effH<=9?`<b>${halfLabel(effH)}</b>부터`:'<b>게임이 끝난 뒤</b>에야'} 나타납니다.</p>
    <div id="st"></div><div class="sum" id="sum"></div>
    <div class="row"><button class="btn" id="go">추가 투자 확정</button><button class="btn ghost" id="skip">이번엔 넘어가기</button></div>`;
  const upd = () => {
    const t = S.topup.E+S.topup.S+S.topup.G;
    $('#sum').innerHTML = `<span>추가 투자 <b>${t}억</b></span><span>남는 예산 <b>${left-t}억</b></span><span>추가 전환 비용 <b>${Math.round((S.topup.S+S.topup.G)*FRIC)}억</b></span>`;
    $('#go').disabled = t===0;
  };
  $('#st').appendChild(stepper(S.topup, left, upd)); upd();
  const next = () => { S.half++; S.revealed=false; S.phase='play'; render(); };
  $('#go').onclick = () => { AREAS.forEach(a=>{ if(S.topup[a]>0) S.inv.push({h:nextH,a,amt:S.topup[a]}); }); next(); };
  $('#skip').onclick = next;
}

function twin(){
  const sc = a => { const [lo,hi]=RANGE[a]; return lo + (hi-lo)*score(sumArea(a)); };
  const me = {E:sc('E'),S:sc('S'),G:sc('G')};
  let best=null, bd=1e9;
  COMPANIES.forEach(c=>{ const d=(c[1]-me.E)**2+(c[2]-me.S)**2+(c[3]-me.G)**2; if(d<bd){bd=d;best=c;} });
  return {best, me};
}

function result(){
  const diff = S.cum - S.cumZero, diffBal = S.cum - S.cumBal, total = invested();
  let cross = -1; for(let i=0;i<10;i++){ if(S.series[i]>S.seriesZero[i]){ cross=i; break; } }
  const behindFirst = S.series[0] < S.seriesZero[0];
  let story;
  if(total===0) story = `ESG에 한 푼도 쓰지 않았어요. 같은 사건을 겪으며 처음부터 33·33·34억으로 나눠 투자했다면 결과는 <b>${sfmt(S.cumBal-S.cum)}</b> 달라졌을 거예요.`;
  else if(diff>0 && behindFirst && cross>0) story = `처음 ${cross}번의 반기 동안은 ESG 0원 회사보다 뒤처졌지만, <b>${halfLabel(cross)}</b>에 역전했어요. 우리 연구가 보여준 “단기 비용, 장기 투자”가 그대로 나타났습니다.`;
  else if(diff>0) story = `ESG 0원 회사보다 <b>${sfmt(diff)}</b> 더 벌었어요. 투자해 둔 영역에서 사건이 터지며 방어력이 빛났습니다.`;
  else story = `이번엔 ESG 0원 회사보다 <b>${sfmt(diff)}</b> 뒤처졌어요. 방어해 둔 영역에서 큰 사건이 적었거나, 투자가 늦어 효과가 나타날 시간이 부족했을 수 있어요.`;
  const t = twin();
  panel.innerHTML = `
    <p class="eyebrow">2031 결산 · ${esc(S.name)} 대표</p>
    <h2>5년 누적 순이익</h2>
    <div class="result-big ${S.cum<0?'minus':''}">${fmt(S.cum)}</div>
    <div class="vs">
      <div class="c"><div class="k">ESG 0원 회사 대비</div><div class="v ${diff<0?'minus':'plus'}">${sfmt(diff)}</div></div>
      <div class="c"><div class="k">처음에 균형 투자(33·33·34) 대비</div><div class="v ${diffBal<0?'minus':'plus'}">${sfmt(diffBal)}</div></div>
    </div>
    <p>${story}</p>
    <div class="chartwrap"><canvas id="chart" width="240" height="120" aria-label="반기별 누적 순이익: 내 회사, ESG 0원 회사, 균형 투자 회사 비교"></canvas>
      <div class="legend"><span style="--c:var(--amber)">내 회사</span><span style="--c:#7e86b8">ESG 0원 회사</span><span style="--c:var(--e)">균형 투자 회사</span></div></div>
    <div class="twin"><span style="font-size:13px;color:var(--mute)">내 ESG 배분(E ${sumArea('E')} · S ${sumArea('S')} · G ${sumArea('G')}억)과 가장 닮은 실제 기업</span>
      <b>${t.best[0]}</b><span style="font-size:13px;color:var(--mute)">실제 ESG 점수 E ${t.best[1]} · S ${t.best[2]} · G ${t.best[3]} · 2023 ROA ${t.best[4]}% (우리 연구 표본 27개사 중)</span></div>
    ${S.practice?'<p class="note">연습 판이라 랭킹에 올리지 않았어요.</p>':`<p class="note">${S.savedNote||'랭킹에 저장하는 중…'}</p>`}
    <h3>랭킹</h3><div data-board></div>
    <div class="row"><button class="btn" id="again">새 CEO로 시작</button><button class="link" id="basis">이 게임의 근거 보기</button></div>
    <div id="basisBox" hidden>${basisHTML()}</div>`;
  drawChart();
  $('#again').onclick = () => { S = fresh(); render(); };
  $('#basis').onclick = () => { $('#basisBox').hidden = !$('#basisBox').hidden; };
}

function drawChart(){
  const c = $('#chart'); if(!c) return; const g = c.getContext('2d');
  const W=240,H=120,L=8,R=8,T=8,B=10;
  g.fillStyle='#0e1126'; g.fillRect(0,0,W,H);
  const all=[0,...S.series,...S.seriesZero,...S.seriesBal]; const mn=Math.min(...all), mx=Math.max(...all);
  const y = v => Math.round(T + (H-T-B) * (1-(v-mn)/((mx-mn)||1)));
  const x = i => Math.round(L + (W-L-R) * i/10);
  g.fillStyle='#1f2547'; for(let i=0;i<=10;i+=2) g.fillRect(x(i),T,1,H-T-B);
  g.fillStyle='#3b4478'; g.fillRect(L,y(0),W-L-R,1);
  const line = (arr,col,w) => { g.fillStyle=col; let px0=x(0), py0=y(0);
    arr.forEach((v,i)=>{ const nx=x(i+1), ny=y(v); g.fillRect(px0,py0,nx-px0+w,w); const top=Math.min(py0,ny); g.fillRect(nx,top,w,Math.abs(ny-py0)+w); px0=nx; py0=ny; }); };
  line(S.seriesZero,'#7e86b8',2); line(S.seriesBal,'#5fd38a',1); line(S.series,'#f0a83a',2);
}

// ───────── 시작 ─────────
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(()=>({S}));
const start = d => { if(d && d.S && d.S.phase){ S = Object.assign(fresh(), d.S); } render(); };
if(hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>

</body>
